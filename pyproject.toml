[project]
name = "flight-detective"
version = "0.1.0"
description = "Flight price intelligence: Paris to northern Pakistan, with the why behind each price move"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "hijri-converter>=2.3",
    "pydantic>=2.8",
    "typer>=0.12",
    "httpx>=0.27",
    "pytz>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "jsonschema>=4.26.0",
]

[project.scripts]
fd = "flight_detective.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flight_detective"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
packages = ["flight_detective"]
mypy_path = "src"
ignore_missing_imports = true
